<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTGA Tracker Overlay</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <div id="overlay" class="overlay">
    <!-- Match grip bar (draggable; hosts status + minimize + hide) -->
    <header class="overlay-header grip" id="matchGrip" data-grip>
      <div class="match-info" id="matchInfo">
        <span class="status" id="matchStatus">Waiting for match...</span>
        <span class="turn-counter" id="turnCounter"></span>
        <span class="win-rate-badge" id="winRateBadge" style="display: none;">
          <span id="winRateValue">0%</span>
        </span>
      </div>
      <button class="grip-btn minimize-btn" id="minimizeBtn" title="Minimize">−</button>
      <button class="grip-btn hide-btn" title="Hide overlay (reopen from dashboard)">✕</button>
    </header>

    <!-- Detailed-logs warning banner -->
    <div class="log-warning" id="logWarning" style="display: none;">
      Detailed Logs are disabled in MTGA — enable "Detailed Logs (Plugin Support)" in
      Options &gt; Account and restart Arena.
    </div>

    <!-- Draft view (shown between draft-start and draft-end) -->
    <section class="draft-view" id="draftView" style="display: none;">
      <!-- Draft grip bar: drag anywhere that isn't a button -->
      <div class="draft-grip grip" id="draftGrip" data-grip>
        <span class="grip-dots" aria-hidden="true"></span>
        <span class="grip-chip" id="draftEventChip">—</span>
        <span class="grip-pickpos" id="draftPickPos"></span>
        <span class="server-dot red" id="serverDot" title="Server offline"></span>
        <button class="grip-btn" id="densityBtn" title="Cycle view (⌘M)">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M4 7h16M4 12h10M4 17h5"/>
          </svg>
        </button>
        <button class="grip-btn hide-btn" title="Hide overlay (reopen from dashboard)">✕</button>
      </div>

      <div class="draft-note" id="draftNote" style="display: none;"></div>

      <!-- Verdict: THE PICK (shown in verdict + full densities) -->
      <div class="verdict" id="verdictView">
        <div class="draft-empty">waiting for pack…</div>
      </div>

      <!-- Mini: one line, top pick name only -->
      <div class="mini-line" id="miniLine"></div>

      <!-- Full density: ranked pack table, pool curve, pick history -->
      <div class="draft-body" id="draftBody">
        <div class="pack-table" id="packTable">
          <div class="draft-empty">waiting for pack…</div>
        </div>
        <div class="pool-strip" id="poolStrip"></div>
        <div class="pick-history">
          <button class="history-toggle" id="historyToggle" aria-expanded="false">
            <span>Pick history</span>
            <span class="history-count" id="historyCount">0</span>
          </button>
          <div class="history-list" id="historyList" style="display: none;"></div>
        </div>
      </div>

      <!-- 17Lands attribution: must remain visible (license requirement) -->
      <footer class="draft-footer">
        <span class="footer-model" id="footerModel"></span>
        <span class="footer-attr">17Lands.com</span>
      </footer>
    </section>

    <!-- Deck tracker content -->
    <main class="overlay-content" id="overlayContent">
      <!-- Deck name -->
      <div class="deck-header" id="deckHeader">
        <span class="deck-name" id="deckName">No deck loaded</span>
        <span class="deck-count" id="deckCount">0 cards</span>
      </div>

      <!-- Card list grouped by type -->
      <div class="card-groups" id="cardGroups">
        <div class="empty-state">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M12 8v8M8 12h8" />
          </svg>
          <p>Start a match to see your deck</p>
        </div>
      </div>

      <!-- Sideboard section -->
      <div class="sideboard-section" id="sideboardSection">
        <button class="sideboard-toggle" id="sideboardToggle" aria-expanded="false">
          <span class="sideboard-label">Sideboard</span>
          <svg class="sideboard-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="sideboard-cards" id="sideboardCards"></div>
      </div>
    </main>

    <!-- Quick stats footer -->
    <footer class="overlay-footer">
      <div class="stat">
        <span class="stat-label">Life</span>
        <span class="stat-value" id="playerLife">20</span>
        <span class="stat-separator">:</span>
        <span class="stat-value opp" id="opponentLife">20</span>
      </div>
      <div class="stat">
        <span class="stat-label">Library</span>
        <span class="stat-value" id="libraryCount">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">Hand</span>
        <span class="stat-value" id="handCount">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">Graveyard</span>
        <span class="stat-value" id="graveyardCount">-</span>
      </div>
    </footer>

    <!-- Manual resize grip (bottom-right; match mode + draft full density) -->
    <div class="resize-handle" id="resizeHandle" title="Resize"></div>
  </div>

  <!-- Match result overlay -->
  <div class="match-result-overlay" id="matchResultOverlay">
    <span class="match-result-text" id="matchResultText"></span>
  </div>

  <!-- Card tooltip -->
  <div class="tooltip" id="cardTooltip">
    <div class="tooltip-name" id="tooltipName"></div>
    <div class="tooltip-type" id="tooltipType"></div>
    <div class="tooltip-cost" id="tooltipCost"></div>
  </div>

  <script type="module" src="./overlay.ts"></script>
</body>
</html>
